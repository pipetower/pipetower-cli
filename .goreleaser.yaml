version: 2

project_name: pt

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pt
    main: ./cmd/pt
    binary: pt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/pipetower/pipetower-cli/internal/version.Version={{ .Version }}
      - -X github.com/pipetower/pipetower-cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/pipetower/pipetower-cli/internal/version.Date={{ .Date }}

# pt is installed with curl -fsSL https://pipetower.com/install-cli | bash, and updates itself
# (pt update): both download these archives and verify them with checksums.txt, so their names
# must not change.
archives:
  - id: pt
    formats: [tar.gz]
    name_template: "pt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

# local snapshots are no release, they never offer updates
snapshot:
  version_template: "dev-{{ .ShortCommit }}"

release:
  # v1.2.0-rc.1 becomes a prerelease, which neither the install script nor pt update installs
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
